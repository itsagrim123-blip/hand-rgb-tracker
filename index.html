<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050711" />
  <title>Hand AR · Foundation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage" aria-label="Webcam hand-tracking augmented reality">
    <video id="camera" autoplay playsinline muted></video>
    <div id="three-root" aria-hidden="true"></div>
    <p class="status">AR <i></i> ONLINE <span id="status">HANDS: 0 · CUBE: READY</span></p>
    <button id="debug-toggle" type="button">DEBUG [D]</button>
    <pre id="debug" hidden></pre>
    <div id="notice"><strong>INITIALIZING AR</strong><span>Allow webcam access. Processing stays on this device.</span></div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
